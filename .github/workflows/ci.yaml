name: CI

on: pull_request

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - name: Set up Docker
        uses: docker/setup-docker-action@v4
      - name: Test
        run: make test IS_TTY=''
